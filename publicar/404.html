<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada (404) | Art Sneyder</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/logo-192.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: radial-gradient(60% 50% at 50% 38%, rgba(249,115,22,.16), transparent 70%), #0a0a0a;
            color: #f3f4f6;
            font-family: Poppins, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
        }
        main { max-width: 560px; }
        .logo { width: 64px; height: 64px; margin: 0 auto 28px; display: block; }
        .code { font-size: clamp(5rem, 22vw, 9rem); font-weight: 800; line-height: 1; margin: 0; letter-spacing: -.04em;
                background: linear-gradient(135deg, #f97316 0%, #ff9d00 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 12px 0 10px; font-weight: 700; }
        p { color: #c4c7ce; line-height: 1.6; margin: 0 0 32px; font-size: 1.05rem; }
        a.btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 34px; border-radius: 999px; color: #fff; font-weight: 600; text-decoration: none;
                background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); transition: transform .25s ease, box-shadow .25s ease; }
        a.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(249,115,22,.4); }
        a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/img/logo-96.png" alt="Art Sneyder" width="64" height="64">
        <p class="code" aria-hidden="true">404</p>
        <h1>Esta página no existe</h1>
        <p>Puede que el enlace esté mal escrito o que la página ya no esté disponible. Vuelve al inicio para ver mi portafolio y servicios.</p>
        <a class="btn" href="/">Volver al inicio <span aria-hidden="true">→</span></a>
    </main>
</body>
</html>
